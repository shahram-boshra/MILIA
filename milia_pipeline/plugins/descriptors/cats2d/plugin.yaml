# plugins/descriptors/cats2d/plugin.yaml
#
# CATS2D topological pharmacophore-pair descriptors (descriptor programme, Pace 7 / v1.10.0).
# 150 PLUGIN-NATIVE descriptors, validated bit-exact vs PyBioMed (scale=1, raw counts).

plugin_name: "cats2d"
version: "1.10.0"
author: "Asadollah (Shahram) Boshra"
email: "a.boshra@gmail.com"
description: "CATS2D topological pharmacophore-pair descriptors: 15 canonical potential-pharmacophore-point pairs (D/A/P/N/L) x 10 topological-distance bins (0-9), raw counts (Schneider 1999)."
license: "MIT"
homepage: "https://github.com/shahram-boshra/MILIA"
milia_version: ">=1.10.0"
python_version: ">=3.10"
dependencies: []

