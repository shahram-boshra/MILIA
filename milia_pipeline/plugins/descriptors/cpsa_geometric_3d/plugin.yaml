# plugins/descriptors/cpsa_geometric_3d/plugin.yaml
#
# CPSA + gravitational + geometrical 3D descriptors (descriptor programme, Pace 9 / v1.12.0).
# 50 PLUGIN-NATIVE 3D descriptors, validated bit-exact vs mordredcommunity.

