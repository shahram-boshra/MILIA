# plugins/descriptors/eta/plugin.yaml
#
# Extended Topochemical Atom (ETA) descriptors (descriptor programme, Pace 8 / v1.11.0).
# 45 PLUGIN-NATIVE descriptors (RDKit-native), validated bit-exact vs mordredcommunity.

plugin_name: "eta"
version: "1.11.0"
author: "Asadollah (Shahram) Boshra"
email: "a.boshra@gmail.com"
description: "Extended Topochemical Atom (ETA) indices of Roy & Ghosh: core count (alpha), shape, valence-electron-mobile counts (beta), composite/functionality/branching (eta), epsilon, psi and their averaged/difference forms (45 total)."
license: "MIT"
homepage: "https://github.com/shahram-boshra/MILIA"
milia_version: ">=1.11.0"
python_version: ">=3.10"
dependencies: []

