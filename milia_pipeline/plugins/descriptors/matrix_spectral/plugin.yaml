# plugins/descriptors/matrix_spectral/plugin.yaml
#
# Eigenvalue / matrix-spectral descriptors (descriptor programme, Pace 5 / v1.8.0). 177 PLUGIN-NATIVE
# descriptors, validated against mordredcommunity (rel-err <= 1e-4).

