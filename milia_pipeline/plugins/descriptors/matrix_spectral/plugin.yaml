version: "1.8.0"
author: "Asadollah (Shahram) Boshra"
email: "a.boshra@gmail.com"
description: "Eigenvalue/matrix-spectral descriptors: adjacency/distance/detour/Barysz matrix spectra (SpAbs/SpMax/SpDiam/SpAD/SpMAD/LogEE/SM1/VE1-3/VR1-3), Burden eigenvalues (BCUT), and Randic molecular ID (MID/AMID)."
license: "MIT"
homepage: "https://github.com/shahram-boshra/MILIA"
milia_version: ">=1.8.0"
python_version: ">=3.10"
dependencies: []

