  - name: "ElectrophilicityIndex"
    function_name: "ElectrophilicityIndex"
    module_path: "descriptors"
    category: "electronic"
    block: "EHT"
    description: "Parr electrophilicity index omega=mu^2/(2 eta) (eV)"
