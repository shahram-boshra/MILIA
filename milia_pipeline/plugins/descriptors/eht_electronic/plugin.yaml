# plugins/descriptors/eht_electronic/plugin.yaml
#
# Electronic / conceptual-DFT reactivity descriptors via RDKit extended Hückel (Pace 10 / v1.13.0).
# 25 PLUGIN-NATIVE EHT-level descriptors, RDKit-native, deterministic, bit-exact.
#
# NOTE: EHT-level (qualitative, method- and geometry-dependent) reactivity descriptors, NOT DFT-grade.

plugin_name: "eht_electronic"
version: "1.13.0"
author: "Asadollah (Shahram) Boshra"
email: "a.boshra@gmail.com"
description: "Electronic / conceptual-DFT reactivity descriptors via RDKit extended Hückel (rdEHTTools): HOMO/LUMO/gap, ionization potential, electron affinity, electronegativity, chemical potential/hardness/softness, electrophilicity, electrodonating/accepting power, EHT charges, and condensed Fukui indices (25 total). EHT-level (qualitative, method-dependent)."
license: "MIT"
homepage: "https://github.com/shahram-boshra/MILIA"
milia_version: ">=1.13.0"
python_version: ">=3.10"
dependencies: []

descriptors:
  - name: "E_HOMO"
    function_name: "E_HOMO"
    module_path: "descriptors"
    category: "electronic"
    block: "EHT"
    description: "EHT HOMO orbital energy (eV)"
    requires_3d: true
    requires_charges: false
    version: "1.13.0"
  - name: "E_LUMO"
    function_name: "E_LUMO"
    module_path: "descriptors"
    category: "electronic"
    block: "EHT"
    description: "EHT LUMO orbital energy (eV)"
    requires_3d: true
    requires_charges: false
    version: "1.13.0"
  - name: "HOMO_LUMO_Gap"
    function_name: "HOMO_LUMO_Gap"
    module_path: "descriptors"
    category: "electronic"
    block: "EHT"
    description: "EHT HOMO-LUMO gap (eV)"
    requires_3d: true
    requires_charges: false
    version: "1.13.0"
  - name: "IonizationPotential"
    function_name: "IonizationPotential"
    module_path: "descriptors"
    category: "electronic"
    block: "EHT"
    description: "ionization potential -E_HOMO (Koopmans, eV)"
    requires_3d: true
    requires_charges: false
    version: "1.13.0"
  - name: "ElectronAffinity"
    function_name: "ElectronAffinity"
    module_path: "descriptors"
    category: "electronic"
    block: "EHT"
    description: "electron affinity -E_LUMO (Koopmans, eV)"
    requires_3d: true
    requires_charges: false
    version: "1.13.0"
  - name: "Electronegativity"
    function_name: "Electronegativity"
    module_path: "descriptors"
    category: "electronic"
    block: "EHT"
    description: "Mulliken electronegativity chi=(IP+EA)/2 (eV)"
    requires_3d: true
    requires_charges: false
    version: "1.13.0"
  - name: "ChemicalPotential"
    function_name: "ChemicalPotential"
    module_path: "descriptors"
    category: "electronic"
    block: "EHT"
    description: "electronic chemical potential mu=-chi (eV)"
    requires_3d: true
    requires_charges: false
    version: "1.13.0"
  - name: "ChemicalHardness"
    function_name: "ChemicalHardness"
    module_path: "descriptors"
    category: "electronic"
    block: "EHT"
    description: "chemical hardness eta=(IP-EA)/2 (eV)"
