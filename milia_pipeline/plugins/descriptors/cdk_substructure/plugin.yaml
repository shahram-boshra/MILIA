# plugins/descriptors/cdk_substructure/plugin.yaml
#
# CDK Laggner substructure-count descriptors (descriptor programme, Pace 11 / v1.14.0).
# 307 DEP-BOUND descriptors via the canonical CDK engine (jpype + CDK-pywrapper jar).
#
# DEP-BOUND + opt-in: requires the [descriptors-cdk] extra (CDK-pywrapper + jpype1) and a JRE.
# Ships DISABLED by default (configs/plugins.yaml disabled_plugins). Canonical CDK values.

plugin_name: "cdk_substructure"
version: "1.15.0"
author: "Asadollah (Shahram) Boshra"
email: "a.boshra@gmail.com"
description: "CDK Laggner substructure-count + Ghose-Crippen descriptors: counts of the 307 Christian Laggner / InteLigand functional-group SMARTS (SubstructureFingerprinter.getCountFingerprint) plus ALogP/ALogp2/AMR (ALOGPDescriptor), via the canonical CDK engine. DEP-BOUND (jpype + CDK-pywrapper), opt-in (310 total)."
license: "MIT"
homepage: "https://github.com/shahram-boshra/MILIA"
milia_version: ">=1.14.0"
python_version: ">=3.11"  # CDK-pywrapper drops 3.10; on 3.10 the plugin is dependency-skipped
dependencies:
  - "CDK-pywrapper"
  - "jpype1"
# Optional-dependency gate: skip this whole plugin cleanly at discovery when the extra is absent
# (default install / Python 3.10 without the JRE) — keeps the default count at 3,026.
requires_extra: "descriptors-cdk"

descriptors:
  - name: "SubFPC1"
    function_name: "SubFPC1"
    module_path: "descriptors"
    category: "fragments"
    block: "SubstructureCount"
    description: "Laggner substructure count: Primary_carbon"
    requires_3d: false
    requires_charges: false
    version: "1.14.0"
