# ─────────────────────────
# DFT Dataset Configuration
# ─────────────────────────
dft_config:
  # VQM24 (Vector-QM24), DFT part: D. Khan, A. Benali, S. Kim, G. F. von Rudorff, O. A. von Lilienfeld,
  # arXiv:2405.05961; data doi:10.5281/zenodo.11164951, complete release zenodo.org/records/15442257.
  # Level of theory: wB97X-D3/cc-pVDZ, Psi4 1.7, density fitting (cc-pVDZ-JKFIT).
  # The authors publish each molecule's atomization energy (`Eatomization`), so MILIA does not compute
  # one from atomic references; select `Eatomization` as a target to use it (see
  # docs/atomic_reference_energies.md).
  raw_npz_filename: DFT_all_sliced.npz
  raw_data_download_url: https://zenodo.org/records/15442257/files/DFT_all.npz?download=1



# ────────────────────────────────────────────────────
# DFT Property Selection for PyG Data Objects
# ────────────────────────────────────────────────────
data_config:
  property_selection:
    DFT:
      # Scalar graph-level targets to be included in pyg_data.y
      scalar_graph_targets_to_include:
        - Etot
        - U0
        - zpves
        - gap
        - Eee
        - Exc
        - Edisp
      # Per-atom properties appended to pyg_data.x as input columns, in this order, after the
      # structural features (one of property_availability.<dataset>.node_features each). The
      # atomic_charges_property below is already the atomic_charge column: do not repeat it here.
      node_features_to_add:
        - Vesp
      # Per-atom targets, stored in pyg_data.node_y (column names in node_y_property_names), never
      # in x; a property is an input or a target, not both (target_selection.target_source: node_y).
      node_targets_to_include: []
      # Per-atom charges for the atomic_charge structural feature (Mulliken, wB97X-D3/cc-pVDZ); one of
      # property_availability.<dataset>.node_features. Remove the key for no atomic_charge column.
      atomic_charges_property: Qmulliken

      # Fixed-size vector graph properties to be added as separate attributes
      vector_graph_properties_to_include:
        - dipole
        - quadrupole
        - octupole
        - hexadecapole
        - rots
      # Variable-length graph properties to be added as separate attributes
      variable_len_graph_properties_to_include:
        - freqs
        - vibmodes

      # DFT-specific settings
      # No computed atomization energy: VQM24 publishes it per molecule as `Eatomization`
      # (author-published; dft_config above). Setting a source here needs
      # dft_config.atomic_references at wB97X-D3/cc-pVDZ (Psi4 1.7).
      calculate_atomization_energy_from: null
      atomization_energy_key_name: null
      # Vibrational refinement settings
      vibration_refinement:
        comparison_tolerance: 1.0e-4 # Tolerance for numerical comparisons when refining freqs and vibmodes


# ────────────────────────────────────────────────────
# DFT Property Availability Matrix
# ────────────────────────────────────────────────────
property_availability:
  DFT:
    molecular_identifiers:
    - compounds
    - inchi
    - graphs
    - frags
    atomic_structure:
    - atoms
    - coordinates
    scalar_graph_targets:
    - Etot
    - U0
    - U298
    - zpves
    - gap
    - Eatomization
    - Eee
    - Exc
    - Edisp
    - H
    - S
    - G
    - Cv
    - Cp
    node_features:
    - Qmulliken
    - Vesp
    vector_graph_properties:
    - dipole
    - quadrupole
    - octupole
    - hexadecapole
    - rots
    variable_len_graph_properties:
    - freqs
    - vibmodes
    # Shapes of the graph-level properties (null: varies between molecules); a property
    # without one takes the first molecule's shape, and every molecule must match it
    shapes:
      dipole: [3]
      quadrupole: [6]
      octupole: [10]
      hexadecapole: [15]
      rots: [3]          # a linear molecule's two constants are padded with 0.0 (DFT handler)
      freqs: [null]
      vibmodes: [null, null, 3]  # modes x atoms x 3
    uncertainty_fields: []
