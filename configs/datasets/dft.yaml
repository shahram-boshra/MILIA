# ─────────────────────────
# DFT Dataset Configuration
# ─────────────────────────
dft_config:
  # VQM24 (Vector-QM24), DFT part: D. Khan, A. Benali, S. Kim, G. F. von Rudorff, O. A. von Lilienfeld,
  # arXiv:2405.05961; data doi:10.5281/zenodo.11164951, complete release zenodo.org/records/15442257.
  # Level of theory: wB97X-D3/cc-pVDZ, Psi4 1.7, density fitting (cc-pVDZ-JKFIT).
  # The authors publish each molecule's atomization energy (`Eatomization`), so MILIA does not compute
  # one from atomic references; select `Eatomization` as a target to use it (see
  # docs/atomic_reference_energies.md).
  raw_npz_filename: DFT_all_sliced.npz
  raw_data_download_url: https://zenodo.org/records/15442257/files/DFT_all.npz?download=1



# ────────────────────────────────────────────────────
# DFT Property Selection for PyG Data Objects
# ────────────────────────────────────────────────────
data_config:
  property_selection:
    DFT:
      # Scalar graph-level targets to be included in pyg_data.y
      scalar_graph_targets_to_include:
        - Etot
        - U0
        - zpves
        - gap
        - Eee
        - Exc
        - Edisp
      # Node-level features to be added to pyg_data.x
      node_features_to_add:
        - Qmulliken     # Essential for mulliken_charge structural feature
        - Vesp
      # Fixed-size vector graph properties to be added as separate attributes
      vector_graph_properties_to_include:
        - dipole
        - quadrupole
        - octupole
        - hexadecapole
        - rots
      # Variable-length graph properties to be added as separate attributes
      variable_len_graph_properties_to_include:
        - freqs
        - vibmodes

      # DFT-specific settings
      # No computed atomization energy: VQM24 publishes it per molecule as `Eatomization`
      # (author-published; dft_config above). Setting a source here needs
      # dft_config.atomic_references at wB97X-D3/cc-pVDZ (Psi4 1.7).
      calculate_atomization_energy_from: null
      atomization_energy_key_name: null
      # Vibrational refinement settings
      vibration_refinement:
        comparison_tolerance: 1.0e-4 # Tolerance for numerical comparisons when refining freqs and vibmodes


