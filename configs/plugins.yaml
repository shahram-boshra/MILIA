# ───────────────────────────
# PLUGIN SYSTEM CONFIGURATION
# ───────────────────────────
# The plugin system allows loading custom graph transformations from external packages.
# This enables extending Milia's capabilities without modifying core code.
#
# Plugins are trusted code: discovering a plugin imports it, which runs its code. MILIA does
# not vet or sandbox plugin code; list a plugin you do not want to run in disabled_plugins.
#
# See milia_pipeline/plugins/transformations/README.md (layout, discovery, trust model) and
# its user_template/README.md (creating a plugin).

plugins:
  # Enable or disable the entire plugin system
  # When false, all plugin-related operations are skipped
  enabled: true

  # List of directories to search for plugins
  # Paths can be absolute or relative to the project root
  # Each directory should contain plugin packages with plugin.yaml metadata
  plugin_paths:
    - milia_pipeline/plugins/transformations  # Local transform plugins container (default)
    # - ~/.milia/plugins             # User-specific plugins
    # - /opt/milia/shared_plugins    # System-wide shared plugins

  # Plugin Discovery Settings
  # Automatically discover plugins in plugin_paths during startup
  auto_discover: true

  # Automatically validate plugins when they are discovered (dependencies,
  # versions, behaviour on sample data); plugin code itself is not vetted
  auto_validate: true

  # Disabled plugins: Plugins that should never be loaded (by plugin_name)
  # Discovery skips them before importing any of their code
  disabled_plugins: []
    # - deprecated_transform_v1
    # - experimental_buggy_plugin

  # Deprecated keys (no effect; each warns when set, removal in 2.0.0):
  #   validation_level, trusted_plugins, allow_experimental, allow_override_builtin,
  #   enforce_checksums, security_scanning, max_plugins, require_metadata,
  #   fail_on_plugin_error, initialization_timeout, log_level, log_discovery,
  #   log_validation, require_validation, trust_mode, enabled_plugins;
  #   paths (use plugin_paths).
