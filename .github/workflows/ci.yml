  #   steps:
  #     - uses: actions/checkout@v6
  #     - name: Install uv
  #       uses: astral-sh/setup-uv@v9.0.0
  #       with:
  #         python-version: "3.10"
  #         enable-cache: true
  #         cache-dependency-glob: "uv.lock"
  #     - run: uv sync --locked --extra cpu --extra dev
