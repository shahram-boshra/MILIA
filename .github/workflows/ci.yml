# =============================================================================
# MILIA — Continuous Integration
# =============================================================================
# Runs on every push to main and on all pull requests.
# Tests across the Python version matrix declared in pyproject.toml classifiers.
#
# Source evidence:
#   - pyproject.toml: Python 3.10/3.11/3.12 classifiers, [tool.pytest], [tool.ruff]
#   - pyproject.toml: [project.optional-dependencies].dev (pytest>=8.0, pytest-mock>=3.14, ruff)
#   - CONTRIBUTING.md: conda install for heavy deps, pip install -e ".[dev]", smoke marker
#   - GitHub Docs: actions/checkout@v6, actions/setup-python@v6 (current latest Feb 2026)
#
# Note: All dependencies (incl. PyTorch, PyG + compiled companions, RDKit) are now
# uv/PyPI-managed and installed from the committed uv.lock via the CPU accelerator extra.
# CI therefore runs the full smoke suite with complete enforcement (no conda, no pip-only
# tolerance workaround). Heavier full-integration runs can be added later as a separate job.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Recommended by actions/setup-python docs
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-24.04
    # F47: every job carries a limit (GitHub default 360 min; ghalint policy 012). Values come from the
    # last 40 successful runs (R70): this job max 0.3 min; the lock-check retry's fast-fail budget ~5 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          # Same uv that writes/validates uv.lock (Dockerfile ARG UV_VERSION); setup-uv otherwise
          # installs the latest uv, whose resolver can disagree with the lock (PA-0i / F41).
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # `uv lock --check` reads the PyG flat find-links indexes on data.pyg.org (a single
      # third-party host outside PyPI). Transient DNS/host failures there are external and
      # not retried by uv itself (uv's HTTP retry covers read-timeouts/5xx/429, NOT DNS —
      # astral-sh/uv#17697), so wrap the step in a backed-off step-level retry.
      - name: Lockfile is in sync with pyproject
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 60
          command: uv lock --check

      - name: Ruff lint
        run: uvx ruff@0.15.0 check .

      - name: Ruff format check
        run: uvx ruff@0.15.0 format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    needs: lint
    # F47 (R70): max 1.3 min (40 runs); 30 min leaves room for one full 20-min sync attempt.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # From pyproject.toml classifiers: Python 3.10, 3.11, 3.12
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.0"  # = Dockerfile UV_VERSION (PA-0i)
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Full scientific stack (PyTorch, PyG + compiled companions, RDKit, …) now installs
      # from PyPI via the locked CPU extra — no conda needed. `--locked` fails if uv.lock is
      # out of sync with pyproject (drift gate). NOTE: use explicit `--extra cpu --extra dev`,
      # never `--all-extras` (the cpu/cu118/cu121/cu124 accelerator extras are mutually
      # exclusive via [tool.uv] conflicts).
      # Fetches the full scientific stack incl. the compiled PyG companions from
      # data.pyg.org. Wrapped in a backed-off step-level retry to absorb transient
      # DNS/host failures on that single external index (not retried by uv — see the
      # lint job note and astral-sh/uv#17697). `--locked` still enforces the drift gate.
      - name: Sync locked environment (CPU stack + dev tools)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 20
          max_attempts: 5
          retry_wait_seconds: 60
          command: uv sync --locked --extra cpu --extra dev

      # Smoke tests are fully enforced: because the heavy deps are now present, any failure
      # fails CI. (The previous pip-only "tolerate exit 1/5" workaround is removed — it existed
      # only because conda deps were unavailable to pip CI.)
      - name: Run smoke tests
        run: uv run --no-sync pytest -m smoke --tb=short -q tests/

  # Gate the opt-in DEP-BOUND `cdk_substructure` plugin (Pace 11 / v1.14.0). It requires the
  # `[descriptors-cdk]` extra (CDK-pywrapper + jpype1), a JRE, and Python >= 3.11 (CDK-pywrapper
  # drops 3.10) — so it cannot be exercised by the 3.10 matrix / the default pipeline, and its
  # tests importorskip elsewhere. This job installs Java + the extra on Python 3.12 and runs the
  # plugin's tests explicitly, so the CDK compute path is actually verified in CI.
  test-cdk:
    name: Test CDK plugin (Python 3.12 + Java)
    runs-on: ubuntu-24.04
    # F47 (R70): p50 1.6 min; the 21.3-min max was the removed apt step (19.9 min, R67).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.0"  # = Dockerfile UV_VERSION (PA-0i)
          python-version: "3.12"
          enable-cache: true
      # F47: Java 21 (= the openjdk-21 that `default-jre-headless` gave on noble, so the verified
      # runtime is unchanged; the CDK-pywrapper jar holds a Java-19 class file). The runner image
      # preinstalls Temurin 21 in the hosted toolcache, so setup-java resolves it locally (no
      # download, no apt — the unbounded apt step took ~20 min on a slow mirror, R67) and sets
      # JAVA_HOME, which jpype's JVM finder reads first.
      - name: Set up Java 21 (Temurin, preinstalled)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Sync deps (+ descriptors-cdk extra)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: uv sync --locked --extra cpu --extra dev --extra descriptors-cdk
      - name: Run cdk_substructure tests (fail — not skip — if the engine is broken)
        timeout-minutes: 10  # F47 (R70): max 1.2 min in 40 runs; a JVM hang fails here, not at the job limit
        run: |
          uv run --no-sync python -c "import CDK_pywrapper, jpype; print('CDK engine deps present')"
          # Assert the JVM/CDK actually boots, so a broken engine FAILS the job instead of the
          # tests silently importorskip-ing (the false-green we are guarding against):
          uv run --no-sync python -c "import importlib.util as u; s=u.spec_from_file_location('c', 'milia_pipeline/plugins/descriptors/cdk_substructure/descriptors.py'); m=u.module_from_spec(s); s.loader.exec_module(m); assert m._init_cdk(), 'CDK engine failed to initialise'; print('CDK engine OK')"
          uv run --no-sync pytest tests/test_descriptor_cdk_substructure_unit.py -q --tb=short -rs

  # P2-5 (blueprint S6): a study shared through a real PostgreSQL server — worker processes within the
  # global budget, heartbeat recovery of a killed worker, study initialization, URL redaction. The
  # service container is the GitHub-documented pattern (health check, port mapped to localhost); the
  # image is the one compose.yaml pins (P2-4c). The concurrency tests run 5 times: one green run of a
  # race-sensitive test proves little.
  test-postgres:
    name: Test PostgreSQL storage (Python 3.12)
    runs-on: ubuntu-24.04
    needs: lint
    # F47 rule for a job without history: bound from its own steps — the sync retry and the 5 test
    # runs (≈30 s each in the sandbox, R80) fit in the 30-min limit of the other test jobs.
    timeout-minutes: 30
    # Least privilege (ghalint 001/013, F48): new jobs add no new finding
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: milia
          POSTGRES_DB: milia_hpo
          # Throwaway credential of an ephemeral CI container reachable only from this job
          POSTGRES_PASSWORD: milia-ci  # pragma: allowlist secret
        options: >-
          --health-cmd "pg_isready --username=milia --dbname=milia_hpo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      MILIA_TEST_POSTGRES_URL: postgresql+psycopg://milia:milia-ci@localhost:5432/milia_hpo  # pragma: allowlist secret
      MILIA_REQUIRE_POSTGRES_TESTS: "1"  # a missing URL or driver fails instead of skipping
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.0"  # = Dockerfile UV_VERSION (PA-0i)
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync deps (+ hpo-postgres extra)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3.0.2
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: uv sync --locked --extra cpu --extra dev --extra hpo-postgres
      - name: Run PostgreSQL integration tests 5 times
        timeout-minutes: 15
        run: |
          for run in 1 2 3 4 5; do
            echo "::group::run ${run}/5"
            uv run --no-sync pytest -m postgres tests/test_hpo_postgres_integration.py -q --tb=short -rs
            echo "::endgroup::"
          done

  # Placeholder for a future FULL test suite (all ~23k tests, not just smoke).
  # With uv the entire scientific stack installs from PyPI, so no conda is needed —
  # enable by uncommenting:
  # test-full:
