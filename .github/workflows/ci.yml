# =============================================================================
# MILIA — Continuous Integration
# =============================================================================
# Runs on every push to main and on all pull requests.
# Tests across the Python version matrix declared in pyproject.toml classifiers.
#
# Source evidence:
#   - pyproject.toml: Python 3.10/3.11/3.12 classifiers, [tool.pytest], [tool.ruff]
#   - pyproject.toml: [project.optional-dependencies].dev (pytest>=8.0, pytest-mock>=3.14, ruff)
#   - CONTRIBUTING.md: conda install for heavy deps, pip install -e ".[dev]", smoke marker
#   - GitHub Docs: actions/checkout@v6, actions/setup-python@v6 (current latest Feb 2026)
#
# Note: All dependencies (incl. PyTorch, PyG + compiled companions, RDKit) are now
# uv/PyPI-managed and installed from the committed uv.lock via the CPU accelerator extra.
# CI therefore runs the full smoke suite with complete enforcement (no conda, no pip-only
# tolerance workaround). Heavier full-integration runs can be added later as a separate job.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Recommended by actions/setup-python docs
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # `uv lock --check` reads the PyG flat find-links indexes on data.pyg.org (a single
      # third-party host outside PyPI). Transient DNS/host failures there are external and
      # not retried by uv itself (uv's HTTP retry covers read-timeouts/5xx/429, NOT DNS —
      # astral-sh/uv#17697), so wrap the step in a backed-off step-level retry.
      - name: Lockfile is in sync with pyproject
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3.0.2
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 60
          command: uv lock --check

      - name: Ruff lint
        run: uvx ruff@0.15.0 check .

      - name: Ruff format check
        run: uvx ruff@0.15.0 format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # From pyproject.toml classifiers: Python 3.10, 3.11, 3.12
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Full scientific stack (PyTorch, PyG + compiled companions, RDKit, …) now installs
      # from PyPI via the locked CPU extra — no conda needed. `--locked` fails if uv.lock is
      # out of sync with pyproject (drift gate). NOTE: use explicit `--extra cpu --extra dev`,
      # never `--all-extras` (the cpu/cu118/cu121/cu124 accelerator extras are mutually
      # exclusive via [tool.uv] conflicts).
      # Fetches the full scientific stack incl. the compiled PyG companions from
      # data.pyg.org. Wrapped in a backed-off step-level retry to absorb transient
      # DNS/host failures on that single external index (not retried by uv — see the
      # lint job note and astral-sh/uv#17697). `--locked` still enforces the drift gate.
      - name: Sync locked environment (CPU stack + dev tools)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3.0.2
        with:
          timeout_minutes: 20
          max_attempts: 5
          retry_wait_seconds: 60
          command: uv sync --locked --extra cpu --extra dev

      # Smoke tests are fully enforced: because the heavy deps are now present, any failure
      # fails CI. (The previous pip-only "tolerate exit 1/5" workaround is removed — it existed
      # only because conda deps were unavailable to pip CI.)
      - name: Run smoke tests
        run: uv run --no-sync pytest -m smoke --tb=short -q tests/

  # Placeholder for a future FULL test suite (all ~23k tests, not just smoke).
  # With uv the entire scientific stack installs from PyPI, so no conda is needed —
  # enable by uncommenting:
  # test-full:
  #   name: Full Test Suite
  #   runs-on: ubuntu-latest
  #   needs: lint
  #   steps:
  #     - uses: actions/checkout@v6
  #     - name: Install uv
  #       uses: astral-sh/setup-uv@v9.0.0
  #       with:
  #         python-version: "3.10"
  #         enable-cache: true
  #         cache-dependency-glob: "uv.lock"
  #     - run: uv sync --locked --extra cpu --extra dev
