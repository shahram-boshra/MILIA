# .github/workflows/docker-publish.yml
#
# Source evidence:
#   - GitHub Docs: "Publishing and installing a package with GitHub Actions"
#   - docker/login-action@v4, docker/metadata-action@v6, docker/build-push-action@v7
#     (current latest per Docker official docs and release pages, Feb 2026)
#   - actions/checkout@v6 (current latest per actions/checkout releases, Feb 2026)
#   - docker/metadata-action README: automatic org.opencontainers.image.source label
#     generation from GitHub context (enables GHCR → repository linking)
name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    # Rebuild on ANY image-affecting change. Denylist (paths-ignore) is used
    # instead of an allowlist (paths) so newly added source/config/test
    # directories trigger a rebuild automatically without editing this workflow.
    # Only paths that are NEVER copied-and-run in a way that alters the image's
    # runtime behavior are excluded. Note: tests/ IS bundled and executed inside
    # the published image (smoke-test job below), so it is intentionally NOT
    # ignored. Ref: GitHub Docs — Workflow syntax, "Excluding paths".
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - 'LICENSE'
    # Release tags publish immutable, versioned images (:X.Y.Z and :X.Y) alongside the
    # PyPI release. `type=semver` (below) derives the version from the tag ref.
    tags:
      - 'v*.*.*'
  # Manual trigger: first-time build, or a one-time versioned backfill via the `version`
  # input (run from the release tag or main). Using workflow_dispatch — not re-pushing a
  # tag — avoids re-firing release.yml (which would attempt a duplicate PyPI upload).
  # From any other ref (feature branch) the run is build-only: nothing is pushed (PA-0a / F26),
  # which makes it the safe way to test changes to this workflow before merging.
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional explicit image version (e.g. 1.3.0) for a manual backfill. Blank = normal latest/sha build.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # PA-0d: the variant list is computed ONCE and consumed by build-and-push and smoke-test, so the
  # images built and the images smoke-tested can never diverge. `cpu` on every run; `cu124` only on
  # release tags (v*) and manual dispatch (PA-0c cadence).
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5  # F47 (R70): max 0.1 min (21 runs)
    permissions: {}
    outputs:
      accel: ${{ steps.variants.outputs.accel }}
    steps:
      - name: Select image variants
        id: variants
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo 'accel=["cpu", "cu124"]' >> "$GITHUB_OUTPUT"
          else
            echo 'accel=["cpu"]' >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: plan
    runs-on: ubuntu-24.04
    # F47 (R70): cpu max 3.6 min (39 runs), cu124 max 7.8 min (5 runs); one value covers both variants.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      publish: ${{ steps.publish.outputs.enabled }}
    strategy:
      fail-fast: false
      matrix:
        # PA-0c (F24) cadence, computed by the `plan` job (PA-0d). GPU images BUILD on a CPU runner
        # (the torch/PyG wheels bundle the CUDA runtime). A dispatch from a non-main branch stays
        # build-only for every variant (PA-0a). TPU is intentionally excluded (PyG's compiled
        # kernels have no XLA backend). One image = one accelerator.
        accel: ${{ fromJSON(needs.plan.outputs.accel) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # PA-0a (F26): only `main` and release tags (`v*`) publish. Any other ref — e.g. a
      # workflow_dispatch from a feature branch used to test this workflow — builds the image
      # without pushing, so the moving tags (`:cpu`, `:latest`) can never be overwritten from a
      # branch. GITHUB_REF is the fully-formed ref (refs/heads/<branch> | refs/tags/<tag>) for
      # push and workflow_dispatch alike.
      - name: Decide publication
        id: publish
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Publishing: ref ${GITHUB_REF} is main or a release tag"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Build-only: ref ${GITHUB_REF} is not main or a release tag (nothing is pushed)"
          fi

      # PA-0d: diagnostic only. The ubuntu-24.04 runner measured 87 GB free before any cleanup
      # (run 36823264572) — far above the GPU build's needs — so nothing is deleted. If a future
      # runner image shrinks, the build fails on disk and this line shows the budget.
      - name: Record runner disk (GPU variants)
        if: matrix.accel != 'cpu'
        run: df -h /

      - name: Log in to GitHub Container Registry
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Per-accelerator tags: moving `:<accel>`, immutable `:<accel>-<sha>`; `:latest` and bare
          # semver only for the cpu (default) variant; GPU variants get suffixed semver
          # (`:X.Y.Z-cu124`, `:X.Y-cu124`) and never `latest` (PA-0c; per-tag suffix/enable —
          # a global `flavor: suffix` would also suffix the `<accel>` raw/sha tags).
          tags: |
            type=raw,value=${{ matrix.accel }}
            type=sha,prefix=${{ matrix.accel }}-
            type=raw,value=latest,enable=${{ matrix.accel == 'cpu' }}
            type=semver,pattern={{version}},enable=${{ matrix.accel == 'cpu' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.accel == 'cpu' }}
            type=semver,pattern={{version}},suffix=-${{ matrix.accel }},enable=${{ matrix.accel != 'cpu' }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.accel }},enable=${{ matrix.accel != 'cpu' }}
            type=raw,value=${{ inputs.version }},enable=${{ matrix.accel == 'cpu' && inputs.version != '' }}
            type=raw,value=${{ inputs.version }}-${{ matrix.accel }},enable=${{ matrix.accel != 'cpu' && inputs.version != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: ${{ steps.publish.outputs.enabled == 'true' }}
          # GPU variants expose all GPUs under --runtime=nvidia; cpu stays "void" (runc behaviour) — PA-0b.
          build-args: |
            ACCEL=${{ matrix.accel }}
            NVIDIA_VISIBLE_DEVICES=${{ matrix.accel == 'cpu' && 'void' || 'all' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # =========================================================================
  # Smoke-test job — satisfies §5f items 8 + 9 of the MILIA Release Guide
  # =========================================================================
  # Pulls the image just published to GHCR and runs the §5f acceptance checks
  # on a GitHub-hosted runner. Reasons for separate job (not steps in the
  # publish job):
  #   - Authoritative source: docker/build-push-action issue #225 — images
  #     loaded with `load: true` are NOT visible in subsequent jobs (each
  #     GitHub Actions job runs on a fresh runner). The published artifact
  #     must be `docker pull`'d in the testing job.
  #   - Testing the registry-pulled image is what reviewers will actually do,
  #     so this catches push-side issues (missing layers, wrong digest,
  #     auth misconfiguration) that an in-process `load: true` would mask.
  #
  # Acceptance criteria mapping:
  #   §5f #8 → "Test pull from your own machine" → satisfied by `docker pull`
  #            from a runner outside the build environment.
  #   §5f #9 → "milia CLI entry point works inside the container" → satisfied
  #            by `milia --help`, `milia --dry-run`, `python main.py --help`.
  #   §5f #8 → "pytest -m smoke passes" → satisfied by the `pytest -m smoke`
  #            invocation against /app/tests/ (verified present in the image
  #            via Dockerfile's `COPY . /app`).
  smoke-test:
    needs: [plan, build-and-push]
    # PA-0a: a build-only run (non-publishing ref) has no registry image to pull.
    if: needs.build-and-push.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # F47 (R70): cpu max 1.8 min (20 runs), cu124 max 2.9 min (2 runs)
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # PA-0d: every variant built in this run is smoke-tested (same list as build-and-push).
        accel: ${{ fromJSON(needs.plan.outputs.accel) }}
    steps:
      - name: Compute lowercase image reference
        # Docker reference-format spec requires lowercase repository names
        # (https://docs.docker.com/reference/cli/docker/image/tag/).
        # `${{ github.repository }}` preserves original case, so we lowercase
        # via `tr` here. The `docker/metadata-action@v5` used in build-and-push
        # auto-lowercases, which is why the push succeeded; here we replicate
        # that behavior at the shell level.
        # PA-0d: pull the IMMUTABLE `<accel>-<short sha>` tag this run published (metadata-action
        # `type=sha` short form = 7 chars), not a moving tag that another run could have replaced.
        id: image
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REF="${IMAGE_LOWER}:${{ matrix.accel }}-${GITHUB_SHA::7}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Computed image reference: ${REF}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull just-published image from GHCR
        run: |
          docker pull ${{ steps.image.outputs.ref }}
          docker inspect ${{ steps.image.outputs.ref }} \
            --format 'Image: {{.Id}}{{"\n"}}Created: {{.Created}}{{"\n"}}Labels: {{json .Config.Labels}}'

      - name: §5f #9 — Verify milia CLI entry point (--help)
        run: |
          docker run --rm ${{ steps.image.outputs.ref }} --help

      - name: §5f #9 — Verify milia --dry-run (configuration validation)
        run: |
          docker run --rm ${{ steps.image.outputs.ref }} --dry-run

      - name: §5f #9 — Verify python main.py --help (fallback entry point)
        run: |
          docker run --rm --entrypoint python \
            ${{ steps.image.outputs.ref }} \
            /app/main.py --help

      # NOTE: `pytest -m smoke` is NOT run here. The published runtime image is a lean
      # PRODUCTION artifact and deliberately excludes dev tools (pytest/ruff). The full
      # smoke suite runs in ci.yml under the locked uv env (`--extra dev`) across the
      # Python matrix. This job validates that the published image *runs* (entry point,
      # non-root, config resolution); ci.yml validates the test suite.

  # =========================================================================
  # GPU smoke test (PA-0d) — dormant unless a GPU runner is configured
  # =========================================================================
  # Runs only when the repository variable GPU_RUNNER_LABEL names a GPU runner (GitHub GPU larger
  # runners need a Team/Enterprise Cloud organization; a self-hosted runner works too) AND this run
  # published a cu124 image. Publishing happens only on `main` and release tags (PA-0a), so this job
  # never runs for pull requests — required for a self-hosted runner on a public repository.
  gpu-smoke:
    needs: [plan, build-and-push]
    if: >-
      vars.GPU_RUNNER_LABEL != '' &&
      needs.build-and-push.outputs.publish == 'true' &&
      contains(needs.plan.outputs.accel, 'cu124')
    runs-on: ${{ vars.GPU_RUNNER_LABEL }}
    # F47 (R70): never run yet (dormant). Bound from its own steps: one cu124 pull (hosted max 2.3 min)
    # plus one short container run, at the same limit as the build job.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Compute lowercase image reference
        id: image
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REF="${IMAGE_LOWER}:cu124-${GITHUB_SHA::7}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Computed image reference: ${REF}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the cu124 image
        run: docker pull ${{ steps.image.outputs.ref }}

      - name: CUDA runtime — torch on the GPU + a PyG CUDA kernel
        run: |
          docker run --rm --gpus all --entrypoint python ${{ steps.image.outputs.ref }} -c "
          import torch, torch_scatter
          assert torch.cuda.is_available(), 'CUDA not available inside the container'
          x = torch.ones(4, device='cuda')
          idx = torch.tensor([0, 0, 1, 1], device='cuda')
          out = torch_scatter.scatter_add(x, idx, dim=0)
          assert out.tolist() == [2.0, 2.0], out.tolist()
          print('OK CUDA', torch.version.cuda, '|', torch.cuda.get_device_name(0), '| torch_scatter CUDA kernel ok')
          "
