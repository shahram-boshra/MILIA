# =============================================================================
# MILIA — Dependabot Configuration
# =============================================================================
# Keeps development dependencies and GitHub Actions up to date.
#
# Source: GitHub Docs — "Configuring Dependabot version updates"
#
# Two ecosystems monitored:
#   1. uv — Python deps in pyproject.toml + uv.lock (runtime + [project.optional-dependencies].dev).
#      The `uv` ecosystem updates pyproject.toml AND regenerates uv.lock in the same PR, keeping the
#      ci.yml `uv lock --check` drift gate green (the `pip` ecosystem does NOT touch uv.lock → red CI).
#   2. github-actions — Actions versions in .github/workflows/ (checkout, setup-uv, etc.)
#
# Ref: Astral uv docs — "Using uv with Dependabot"; GitHub Docs — "Configuring Dependabot version updates".
# =============================================================================

version: 2

updates:
  # Python dependencies — uv ecosystem (updates BOTH pyproject.toml AND uv.lock in the same PR).
  # MUST be `uv`, not `pip`: the pip ecosystem edits pyproject.toml but leaves uv.lock stale, so
  # ci.yml's `uv lock --check` (drift gate) fails on every bump PR. Astral docs: "Dependabot supports
  # updating uv.lock files. To enable it, add the uv package-ecosystem." (docs.astral.sh/uv → Dependabot).
  # cooldown avoids opening PRs before uv can resolve a freshly-published version.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
      include: "scope"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
