# =============================================================================
# MILIA — pyproject.toml
# =============================================================================
# Canonical project metadata per PEP 517/518/621/639.
# Migrated from setup.py (100% static metadata — no dynamic build logic).
#
# Version is read dynamically from milia_pipeline/__init__.py.__version__
# via the setuptools `attr` directive (single source of truth).
#
# Dependencies: managed with uv (https://docs.astral.sh/uv/) from the committed uv.lock.
# All packages (PyTorch, RDKit, PyG + compiled companions, etc.) install from PyPI +
# the pinned PyTorch/PyG indexes below. Choose one accelerator extra. Install via:
#   uv sync --locked --extra cpu          # or cu126 | cu130
#   uv sync --locked --extra cpu --extra dev   # + dev tools
# =============================================================================

# ---- Build System (PEP 517/518) ----
[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

# ---- Project Metadata (PEP 621/639) ----
[project]
name = "milia-py"
dynamic = ["version"]
description = "Molecular graph processing and machine learning framework for molecular sciences"
readme = "README.md"
# 3.11.4 is the first 3.11 release with tarfile extraction filters (PEP 706; tarfile docs "Changed in
# version 3.11.4: Added the filter parameter"), which MILIA's archive extraction uses (filter="data").
requires-python = ">=3.11.4,<3.13"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    {name = "Asadollah (Shahram) Boshra", email = "a.boshra@gmail.com"},
]
maintainers = [
    {name = "Asadollah (Shahram) Boshra", email = "a.boshra@gmail.com"},
]

keywords = [
    "molecular machine learning",
    "quantum chemistry",
    "graph neural networks",
    "molecular descriptors",
    "pytorch geometric",
    "dataset pipeline",
    "drug discovery",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# Runtime dependencies (uv/PyPI-managed; versions pinned to the validated Phase-0 baseline).
# Accelerator-agnostic packages live here; torch + the compiled PyG companions live in the
# mutually-exclusive accelerator extras below (cpu / cu126 / cu130), sourced from the
# per-accelerator indexes in [tool.uv.sources]. See UV_MIGRATION_STRATEGY.md.
dependencies = [
    "torch-geometric==2.8.1",       # pure-Python; compiled kernels are in the accelerator extras
    "numpy==1.26.4",                # hold NumPy 1.x ABI
    "scipy==1.15.2",
    "pandas==2.3.1",
    "pyyaml==6.0.2",
    "rdkit==2025.3.6",              # 2025.3.6 fixes GETAWAY nondeterminism (rdkit#7264; req. by addcore_3d)
    "matplotlib==3.10.3",
    "scikit-learn==1.5.2",
    "pydantic-settings==2.10.1",
    # Implicit direct deps, imported unguarded by first-party code but only transitive until now; each is
    # declared at the version already locked.
    # pydantic: 39 modules (config schemas, transforms, plugin manifests, model builders).
    "pydantic==2.13.4",
    # requests, tqdm: datasets/milia_dataset.py.
    "requests==2.34.2",
    "tqdm==4.70.0",
    # sqlalchemy: models/hpo/shared_study.py (storage URLs).
    "sqlalchemy==2.0.51",
    # networkx: 4 shipped transformation plugins.
    "networkx==3.6.1",
    "torchmetrics==1.9.0",
    "optuna==4.9.0",
    "optuna-dashboard==0.20.0",
    "plotly==6.9.0",
    "kaleido==1.3.0",
    "ase==3.29.0",
    "qc-iodata==1.0.1",
    "ray[tune]==2.56.1",
    "psutil==7.2.2",                # implicit direct dep (3 import sites); conda supplied, never declared
    "h5py==3.16.0",                 # implicit direct dep (4 preprocessor import sites)
    # implicit direct dep (4 import sites: models/model_plugin_system.py, transformations/plugin_system.py,
    # transformations/graph_transforms.py, models/hpo/backends/optuna_backend.py); was only transitive
    "packaging==26.2",
]

[project.optional-dependencies]
# Developer / CI dependencies (installed via: pip install -e ".[dev]")
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.15.1",
    # Pinned to match .pre-commit-config.yaml (ruff-pre-commit rev v0.15.0) so
    # local hooks and CI run byte-identical Ruff. Leaving 'ruff' unpinned let CI
    # pull 0.16.0 (released 2026-07-23), whose breaking default — formatting
    # Python code blocks inside Markdown — failed `ruff format --check .` on
    # unchanged docs. Bump this and the pre-commit rev together in a deliberate
    # upgrade. Ref: astral-sh/ruff 0.16.0 release notes (Breaking changes).
    "ruff==0.15.0",
]
# Documentation build dependencies (installed via: pip install -e ".[docs]")
# Sphinx <8.2: 8.2+ drops Python 3.10 support (sphinx-doc/sphinx#13325).
# Also available as: pip install -r docs/requirements.txt
docs = [
    "sphinx>=8.1.3,<8.2",
    "pydata-sphinx-theme>=0.17.0",
    "myst-parser>=4.0",
    "sphinx-copybutton>=0.5.2",
]
# DEP-BOUND, opt-in: the `cdk_substructure` descriptor plugin (Pace 11 / v1.14.0). Provides the
# 307 Laggner substructure counts via the CANONICAL CDK engine (jpype + CDK-pywrapper's bundled
# CDK jar — offline-safe, not fetched from Maven at runtime). Requires a JRE at runtime; without the
# extra or the JRE the plugin auto-skips (dependency-gated). Install: `pip install -e ".[descriptors-cdk]"`
# (or `uv sync --extra descriptors-cdk`) with a JRE present.
# The base install and the default descriptor count (3,026) are unaffected without this extra.
descriptors-cdk = [
    "CDK-pywrapper>=1.0",  # provides the complete CDK jar in its wheel
    "jpype1>=1.5",  # the plugin loads that jar via jpype directly (CDK-pywrapper itself does NOT depend on jpype)
]
# Opt-in: PostgreSQL driver for an HPO study shared by several workers (P2-4b, blueprint S4):
# psycopg 3, SQLAlchemy URL `postgresql+psycopg://`. Lower bound = the tested release (PyPA: no exact
# pins in project metadata); uv.lock pins the exact version. The binary wheel bundles libpq/OpenSSL,
# which system updates do not patch; for production servers psycopg recommends a local `psycopg[c]`
# build against the system libpq. Install: `uv sync --extra cpu --extra hpo-postgres`.
hpo-postgres = ["psycopg[binary]>=3.3.6"]
# Mutually-exclusive accelerator variants (choose one: `uv sync --extra cpu` | cu126 | cu130).
# torch + the compiled PyG companions are gated to the matching index in [tool.uv.sources].
# torch 2.12 is the newest minor with a PyG release declaring support (PyG 2.8.0) and PyG wheels for
# every variant below. pyg-lib provides radius/knn/fps and spline kernels (PyG 2.8 deprecated
# torch-cluster and torch-spline-conv in its favour). cu130 needs NVIDIA driver >= 580 and drops
# Maxwell/Pascal/Volta GPUs (CUDA 13.0 release notes); cu126 serves those GPUs and older drivers.
# tests/test_platform_consistency.py keeps these pins, the indexes and dependabot.yml in step.
cpu   = ["torch==2.12.1", "pyg-lib==0.9.0", "torch-scatter==2.1.2", "torch-sparse==0.6.18"]
cu126 = ["torch==2.12.1", "pyg-lib==0.9.0", "torch-scatter==2.1.2", "torch-sparse==0.6.18"]
cu130 = ["torch==2.12.1", "pyg-lib==0.9.0", "torch-scatter==2.1.2", "torch-sparse==0.6.18"]

[project.urls]
Homepage = "https://github.com/shahram-boshra/MILIA"
Repository = "https://github.com/shahram-boshra/MILIA"
Documentation = "https://milia.readthedocs.io"
"PyPI" = "https://pypi.org/project/milia-py/"
"Bug Tracker" = "https://github.com/shahram-boshra/MILIA/issues"
Changelog = "https://github.com/shahram-boshra/MILIA/blob/main/CHANGELOG.md"

# CLI entry point: `milia` command invokes main.main()
# main.py resides at project root (outside milia_pipeline package).
# It is explicitly included via [tool.setuptools] py-modules = ["main"]
# so that both editable (`pip install -e .`) and non-editable (`pip install .`)
# installs make the `main` module importable from site-packages.
[project.scripts]
milia = "main:main"

# ---- Setuptools-Specific Configuration ----

# Dynamic version: read from milia_pipeline/__init__.py's __version__ attribute.
# This is the single source of truth for the project version.
[tool.setuptools.dynamic]
version = {attr = "milia_pipeline.__version__"}

# Standalone modules: include main.py (project root) as a top-level module.
# Required for the `milia` CLI entry point (`main:main`) to resolve via
# `from main import main` after non-editable install (`pip install .`).
# Without this, main.py is NOT packaged into the wheel and the `milia`
# command fails with: ModuleNotFoundError: No module named 'main'.
[tool.setuptools]
py-modules = ["main"]

# Package discovery: auto-find all packages under the project root.
# Excludes test directories, scripts, docs, and legacy/archive directories.
[tool.setuptools.packages.find]
include = ["milia_pipeline*"]
exclude = [
    "tests*",
    "test_data*",
    "scripts*",
    "docs*",
    "examples*",
    "experiments*",
    "archive*",
    "_legacy*",
]

# Include YAML configuration files bundled inside the package.
[tool.setuptools.package-data]
milia_pipeline = ["*.yaml", "*.yml"]

# ---- Tool Configurations ----

# pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
# Warning policy (last-match-wins — pytest applies filters bottom-up):
#
#   1. Silence DeprecationWarning broadly. Rationale: MILIA's heavy scientific
#      dependency tree (matplotlib, plotly, kaleido, pyparsing, torch,
#      torch_geometric, rdkit, pydantic) emits a steady stream of upstream
#      deprecation chatter that is OUTSIDE this project's control and clutters
#      reviewer-facing test output. Documented authoritative example: matplotlib
#      ._mathtext invokes pyparsing's deprecated camelCase API (setName,
#      setParseAction, parseAll, leaveWhitespace, endQuoteChar, unquoteResults)
#      whenever any matplotlib log-scale tick label is rendered — generated
#      ~265 of 270 warnings observed in test_visualization_unit.py. Will be
#      resolved upstream (matplotlib + pyparsing maintainers); not actionable
#      from MILIA. Reference: pytest filterwarnings docs, last-match-wins rule.
#
#   2. Re-enable DeprecationWarning as error ONLY for first-party code
#      (milia_pipeline.*). Rationale: MILIA must not silently rely on its own
#      deprecated APIs. If MILIA itself ever emits a DeprecationWarning, the
#      test suite fails — forcing the issue to be fixed at source rather than
#      filtered. This preserves the "fail loud on our own code" discipline
#      while accepting that we cannot fix our dependencies for them.
#
#   3. Silence ONE specific PyTorch Geometric UserWarning: the "Unable to
#      accurately infer 'num_nodes'" notice emitted by
#      torch_geometric.data.storage when a Data() object has no node-level
#      attributes. Per PyG's own documentation (Data.num_nodes property
#      docstring), this warning is INFORMATIONAL and is the documented
#      mechanism by which PyG asks callers to set num_nodes explicitly when
#      working with edge-only graphs. MILIA's pyg_integration.compute_graph_
#      statistics() function is required to gracefully handle empty Data()
#      objects, and the test suite (TestComputeGraphStatisticsExtended::
#      test_no_node_info_at_all) deliberately exercises this path to assert
#      stats["num_nodes"] is None. The warning is therefore expected behavior
#      under test and is not actionable from MILIA. Filter scope is narrow
#      (exact message prefix + UserWarning category + torch_geometric.data.
#      storage module) so all other PyG UserWarnings continue to surface.
#      The message prefix and emitting module path are stable across PyG
#      versions 2.0.3 through latest (verified upstream source).
#
#   4. Silence ONE specific PyTorch UserWarning: the "Detected call of
#      `lr_scheduler.step()` before `optimizer.step()`" notice emitted by
#      torch.optim.lr_scheduler.LRScheduler.step() when its internal
#      _step_count advances ahead of the optimizer's _step_count. This is
#      a heuristic intended to catch end-user training-loop ordering bugs;
#      it is NOT a defect detector for scheduler unit tests. MILIA's
#      tests/test_schedulers_unit.py (TestSchedulerFunctionality and
#      TestEdgeCases classes) deliberately drive scheduler.step() in
#      isolation to verify LR-decay arithmetic (StepLR halving, exponential
#      decay, cosine curve, plateau behavior) without constructing a full
#      training loop — by design, no optimizer.step() precedes these
#      scheduler steps. The warning is therefore expected behavior under
#      these unit tests and is not actionable from MILIA. Filter scope is
#      narrow (exact message prefix + UserWarning category + torch.optim.
#      lr_scheduler module) so any unrelated PyTorch UserWarning continues
#      to surface.
#
#   5. Silence ONE specific PyTorch UserWarning emitted by PyTorch ITSELF
#      from inside SequentialLR.step(): "The epoch parameter in
#      `scheduler.step()` was not necessary and is being deprecated …".
#      Despite the message wording, this warning is raised as UserWarning
#      (not DeprecationWarning) — verified in PyTorch source
#      torch/optim/lr_scheduler.py: warnings.warn(EPOCH_DEPRECATION_WARNING,
#      UserWarning). The warning is triggered because PyTorch's own
#      SequentialLR.step() implementation calls the inner scheduler with
#      scheduler.step(0) when crossing a milestone, passing the deprecated
#      epoch argument internally. MILIA's create_warmup_scheduler() helper
#      (milia_pipeline/models/training/schedulers.py) builds a SequentialLR
#      and never passes epoch from MILIA code. This is a well-known,
#      acknowledged upstream PyTorch bug tracked in issues
#      pytorch/pytorch#67586, #76113, #116776, and #130018 — fix is upstream
#      and not actionable from MILIA. Filter scope is narrow (exact message
#      prefix + UserWarning category + torch.optim.lr_scheduler module).
#
# References:
#   - https://docs.pytest.org/en/stable/how-to/capture-warnings.html
#   - https://pytorch-geometric.readthedocs.io/en/latest/_modules/torch_geometric/data/data.html
#     (Data.num_nodes property — documents the inference-warning contract)
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:Unable to accurately infer 'num_nodes':UserWarning:torch_geometric.data.storage",
    "ignore:Detected call of `lr_scheduler.step\\(\\)` before `optimizer.step\\(\\)`:UserWarning:torch.optim.lr_scheduler",
    "ignore:The epoch parameter in `scheduler.step\\(\\)` was not necessary and is being deprecated:UserWarning:torch.optim.lr_scheduler",
    "error::DeprecationWarning:milia_pipeline",
    "error::PendingDeprecationWarning:milia_pipeline",
]
markers = [
    "smoke: Smoke tests — fast, first gate in CI/CD pipeline",
    "contract: Interface contract validation tests",
    "e2e: End-to-end workflow tests",
    "regression: Regression protection tests",
    "thread_safety: Concurrent access tests",
    "slow: Tests taking > 30 seconds (deselect with '-m \"not slow\"')",
    "perf: Performance benchmarks — wall-clock timing, measured best-of-N (min); the min is the machine lower bound, immune to CI load spikes (timeit docs)",
    "integration: marks integration tests",
    "gpu: marks tests requiring GPU",
    "postgres: needs a PostgreSQL server named by MILIA_TEST_POSTGRES_URL (CI job test-postgres)",
]

# uv — accelerator-aware resolution (see UV_MIGRATION_STRATEGY.md)
[tool.uv]
# Lock scoped to Linux x86_64 (matches the deployed amd64 image and CI runners). Broaden only after
# checking that every platform-specific wheel (torch, pyg-lib, torch-scatter, torch-sparse) exists for
# the target on each accelerator index (PA-0i / F41).
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# The accelerator extras are mutually exclusive — uv refuses to resolve two at once.
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }]]
# Without an accelerator extra, torch still enters the lock through torchmetrics (`torch>=2.0.0`) and
# resolves from PyPI; uv keeps the previously locked version there unless constrained, which left
# torch 2.4.0 (CVE-2025-32434) in the lock. This constraint holds that fork to the extras' release.
constraint-dependencies = ["torch==2.12.1"]

# pytorch-* are PEP 503 simple indexes; pyg-* are FLAT find-links HTML pages → format="flat"
# (a plain index entry makes uv probe sub-paths → 403). explicit=true scopes each index to the
# packages pinned to it in [tool.uv.sources]; everything else resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url  = "https://download.pytorch.org/whl/cpu"
explicit = true
[[tool.uv.index]]
name = "pytorch-cu126"
url  = "https://download.pytorch.org/whl/cu126"
explicit = true
[[tool.uv.index]]
name = "pytorch-cu130"
url  = "https://download.pytorch.org/whl/cu130"
explicit = true
# PyG names its wheel pages after the minor's .0 release for every patch of it ("PyTorch 2.12.*:
# ${TORCH}=2.12.0", PyG installation docs), so torch 2.12.1 uses torch-2.12.0+<accel>.html.
[[tool.uv.index]]
name = "pyg-cpu"
url  = "https://data.pyg.org/whl/torch-2.12.0+cpu.html"
format = "flat"
explicit = true
[[tool.uv.index]]
name = "pyg-cu126"
url  = "https://data.pyg.org/whl/torch-2.12.0+cu126.html"
format = "flat"
explicit = true
[[tool.uv.index]]
name = "pyg-cu130"
url  = "https://data.pyg.org/whl/torch-2.12.0+cu130.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]
pyg-lib = [
    { index = "pyg-cpu", extra = "cpu" }, { index = "pyg-cu126", extra = "cu126" },
    { index = "pyg-cu130", extra = "cu130" },
]
torch-scatter = [
    { index = "pyg-cpu", extra = "cpu" }, { index = "pyg-cu126", extra = "cu126" },
    { index = "pyg-cu130", extra = "cu130" },
]
torch-sparse = [
    { index = "pyg-cpu", extra = "cpu" }, { index = "pyg-cu126", extra = "cu126" },
    { index = "pyg-cu130", extra = "cu130" },
]

# ruff (linter + formatter)
[tool.ruff]
target-version = "py311"
line-length = 100
# Ruff 0.16+ formats Python code blocks inside Markdown by default. MILIA's
# formatting scope is Python-only (mirrors the ruff-format pre-commit hook),
# and the *.md docs hold illustrative snippets not maintained as formatted
# source. Exclude Markdown explicitly so the scope stays deterministic across
# Ruff upgrades. CI runs `ruff format --check .` (a directory scan), for which
# extend-exclude is honored; the ruff-format pre-commit hook also passes
# --force-exclude. Ref: docs.astral.sh/ruff/formatter (Markdown) & settings.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["milia_pipeline"]

[tool.ruff.lint.per-file-ignores]
# Test files use deferred imports (conftest.py design) to avoid collection-time
# failures when heavy deps (torch, torch_geometric, numpy) are not installed.
# This is a deliberate architectural decision — NOT suppressible at source.
"tests/*" = ["E402"]
# __init__.py files re-export symbols for public API convenience.
# F401: Re-exported names appear "unused" to the linter but are consumed by importers.
# E402: Imports come after module docstrings/comments — standard packaging practice.
"__init__.py" = ["F401", "E402"]

# coverage.py
[tool.coverage.run]
source = ["milia_pipeline"]
omit = [
    "tests/*",
    "scripts/*",
    "examples/*",
    "archive/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 70
